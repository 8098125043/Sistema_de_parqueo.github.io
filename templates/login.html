<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Parqueo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/estilo_index.css">
</head>

<body>
    <div class="main">
        <a href="#"><img src="../static/img/parkin.png" alt="Parkinslot"></a>
        <h2>Iniciar Sesión</h2>
        <form class="formulario" id="login-form" action="/login" method="POST">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="inicioseccion">Iniciar Sesión</button>
        </form>
        {% if error %}
        <script>
            alert('{{ error }}');
        </script>
        {% endif %}
        <p class="texto uno">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Sistema de Parqueo. Todos los derechos reservados.</p>
        <p><img src="../static/img/correo.png" alt=""> <a href="tel:8098125043">809-812-5043</a></p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js')}}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
